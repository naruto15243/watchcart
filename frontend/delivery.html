<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Delivery</title>
    <style>
      :root { --bg: #07111f; --panel: rgba(13, 28, 49, 0.9); --border: rgba(255,255,255,0.08); --text:#edf4ff; --muted:#a9bdd8; --primary:#7c8cff; --primary-2:#48c2ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg, #07111f 0%, #0d1c31 48%, #0b1527 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:700; }
      .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
      .panel { background: var(--panel); border:1px solid var(--border); border-radius:22px; padding:22px; box-shadow: 0 18px 40px rgba(3,8,17,0.25); }
      .timeline { display:grid; gap:14px; margin-top:18px; }
      .step { display:flex; gap:12px; align-items:flex-start; }
      .dot { width:12px; height:12px; border-radius:50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); margin-top:5px; }
      .meta { color: var(--muted); }
      .track { display:grid; gap:10px; }
      .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
      @media (max-width:768px){ .topbar { display:grid; grid-template-columns:1fr; gap:12px; } .page{grid-template-columns:1fr;} }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="delivery.html" class="active">Delivery</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
        </nav>
      </header>

      <main class="page">
        <section class="panel">
          <h2>Delivery tracking</h2>
          <div class="timeline">
            <div class="step"><div class="dot"></div><div><strong>Order packed</strong><div class="meta">Today, 10:15 AM</div></div></div>
            <div class="step"><div class="dot"></div><div><strong>In transit</strong><div class="meta">Today, 2:30 PM</div></div></div>
            <div class="step"><div class="dot"></div><div><strong>Out for delivery</strong><div class="meta">Tomorrow, 9:00 AM</div></div></div>
            <div class="step"><div class="dot"></div><div><strong>Delivered</strong><div class="meta">Expected by 1:30 PM</div></div></div>
          </div>
        </section>

        <aside class="panel track">
          <h2>Shipment summary</h2>
          <div class="row"><span>Order ID</span><strong>ORD-1042</strong></div>
          <div class="row"><span>Courier</span><strong>Blue Dart</strong></div>
          <div class="row"><span>ETA</span><strong>Tomorrow</strong></div>
          <div class="row"><span>Location</span><strong>Bengaluru</strong></div>
        </aside>
      </main>
    </div>
  </body>
</html>

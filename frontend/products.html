<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Products</title>
    <style>
      :root {
        --bg: #081521;
        --bg-soft: #0f1f31;
        --panel: rgba(16, 35, 55, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #edf6ff;
        --muted: #afd0ee;
        --primary: #7c8cff;
        --primary-2: #49c6ff;
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, rgba(89, 113, 255, 0.18), transparent 25%), linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:800; }
      .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow:0 10px 30px rgba(72,198,255,0.35); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; }
      .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:18px; }
      .card { background: linear-gradient(180deg, rgba(16,35,55,0.9), rgba(14,28,45,0.85)); border:1px solid var(--border); border-radius:22px; overflow:hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.18); }
      .card img { width:100%; height:180px; object-fit:cover; }
      .content { padding:18px; }
      .meta { display:flex; justify-content:space-between; font-size:0.72rem; color: var(--primary-2); text-transform: uppercase; letter-spacing: 0.06em; }
      .content p { color: var(--muted); line-height:1.6; }
      .footer { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
      .btn { border:none; border-radius:999px; padding:0.8rem 1rem; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; font-weight:700; }
      @media (max-width:768px){ .topbar { display:grid; grid-template-columns:1fr; gap:12px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html" class="active">Products</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
          <a href="login.html">Login</a>
          <a href="profile.html">Profile</a>
        </nav>
      </header>

      <main class="page">
        <h2>Featured products</h2>
        <div class="grid" id="productGrid"></div>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:5000/api';
      const formatCurrency = (value) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value || 0);

      async function loadProducts() {
        try {
          const response = await fetch(`${API_BASE}/products`);
          const result = await response.json();
          const products = result.data || [];

          document.getElementById('productGrid').innerHTML = products.map((product) => `
            <article class="card">
              <img src="${product.image || 'https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=800&q=80'}" alt="${product.name}" />
              <div class="content">
                <div class="meta"><span>${product.category || 'General'}</span><span>${product.brand || 'WatchCart'}</span></div>
                <h3>${product.name}</h3>
                <p>${product.description || 'Built for performance, comfort, and daily use.'}</p>
                <div class="footer">
                  <strong>${Number(product.rating || 4.5).toFixed(1)} ★</strong>
                  <span>${formatCurrency(product.price)}</span>
                </div>
                <div class="footer"><button class="btn" type="button" data-product-id="${product._id}" data-name="${product.name}" data-price="${product.price}">Add to cart</button></div>
              </div>
            </article>
          `).join('');

          document.querySelectorAll('[data-product-id]').forEach((button) => {
            button.addEventListener('click', async () => {
              const token = localStorage.getItem('watchcart_token');
              if (!token) {
                window.location.href = 'login.html';
                return;
              }

              const payload = {
                itemType: 'product',
                itemId: button.dataset.productId,
                name: button.dataset.name,
                price: Number(button.dataset.price),
                quantity: 1,
                image: 'https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=800&q=80'
              };

              const response = await fetch(`${API_BASE}/cart`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify(payload)
              });

              const result = await response.json();
              alert(result.message || 'Added to cart');
            });
          });
        } catch (error) {
          document.getElementById('productGrid').innerHTML = '<p>Unable to load products right now.</p>';
        }
      }

      loadProducts();
    </script>
  </body>
</html>

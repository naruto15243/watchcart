<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | 404</title>
    <style>
      :root { --bg: #07111f; --panel: rgba(13, 28, 49, 0.9); --border: rgba(255,255,255,0.08); --text:#edf4ff; --muted:#a9bdd8; --primary:#7c8cff; --primary-2:#48c2ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg, #07111f 0%, #0d1c31 48%, #0b1527 100%); color: var(--text); }
      .shell { min-height:100vh; display:grid; place-items:center; padding:20px; }
      .card { max-width:500px; text-align:center; background: var(--panel); border:1px solid var(--border); border-radius:24px; padding:40px 28px; box-shadow: 0 18px 40px rgba(3,8,17,0.25); }
      h1 { font-size:4rem; margin:0 0 12px; }
      p { color: var(--muted); line-height:1.7; }
      a { display:inline-block; margin-top:12px; border-radius:999px; padding:0.9rem 1.2rem; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color:white; text-decoration:none; font-weight:700; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you are looking for does not exist or has moved.</p>
        <a href="index.html">Go back home</a>
      </div>
    </div>
  </body>
</html>

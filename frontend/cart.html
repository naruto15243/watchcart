<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Cart</title>
    <style>
      :root {
        --bg: #081521;
        --bg-soft: #0f1f31;
        --panel: rgba(16, 35, 55, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #edf6ff;
        --muted: #afd0ee;
        --primary: #7c8cff;
        --primary-2: #49c6ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body { font-family: Inter, system-ui, -apple-system, sans-serif; background: radial-gradient(circle at top, rgba(89, 113, 255, 0.18), transparent 25%), linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--text); }
      a { text-decoration: none; color: inherit; }
      .site-shell { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--border); }
      .brand-wrap { display:flex; align-items:center; gap:12px; font-weight:800; }
      .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow:0 10px 30px rgba(72,198,255,0.35); }
      .nav-links { display:flex; gap:18px; flex-wrap:wrap; }
      .nav-links a { color: var(--muted); font-weight: 600; }
      .nav-links a.active { color: var(--text); }
      .page-content { padding-top: 28px; }
      .page-panel, .summary-box, .cart-item { background: linear-gradient(180deg, rgba(16,35,55,0.9), rgba(14,28,45,0.85)); border:1px solid var(--border); border-radius:22px; box-shadow: 0 15px 35px rgba(0,0,0,0.18); }
      .page-panel { padding: 24px; }
      .cart-layout { display:grid; grid-template-columns: 1.3fr 0.7fr; gap:24px; }
      .cart-item { padding: 18px; }
      .summary-box { padding:22px; }
      .cart-top, .row { display:flex; justify-content:space-between; gap:12px; }
      .row { padding:10px 0; border-bottom:1px solid var(--border); }
      .row.total { border-bottom:none; font-size:1.05rem; }
      .primary-btn { display:inline-flex; align-items:center; justify-content:center; width:100%; border-radius:999px; padding:0.9rem 1.2rem; font-weight:700; margin-top:16px; background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:white; }
      @media (max-width:768px) { .topbar { display:grid; grid-template-columns:1fr; gap:12px; } .cart-layout { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">W</div>
          <span>WatchCart</span>
        </div>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="cart.html" class="active">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
        </nav>
      </header>

      <main class="page-content">
        <section class="page-panel">
          <div class="section-head">
            <h2>Shopping cart</h2>
          </div>
          <div class="cart-layout">
            <div id="cartItems"></div>
            <aside class="summary-box">
              <h3>Order summary</h3>
              <div class="row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
              <div class="row"><span>Delivery</span><strong id="delivery">₹0</strong></div>
              <div class="row total"><span>Total</span><strong id="total">₹0</strong></div>
              <a class="primary-btn" href="payment.html">Proceed to payment</a>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:5000/api';
      const formatCurrency = (value) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value || 0);

      async function loadCart() {
        const token = localStorage.getItem('watchcart_token');
        if (!token) {
          document.getElementById('cartItems').innerHTML = '<div class="cart-item"><p>Please login to view your cart.</p></div>';
          document.getElementById('subtotal').textContent = formatCurrency(0);
          document.getElementById('delivery').textContent = formatCurrency(0);
          document.getElementById('total').textContent = formatCurrency(0);
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/cart`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const result = await response.json();
          const cart = result.data || { items: [], subtotal: 0, deliveryCharge: 0, total: 0 };

          document.getElementById('subtotal').textContent = formatCurrency(cart.subtotal || 0);
          document.getElementById('delivery').textContent = formatCurrency(cart.deliveryCharge || 0);
          document.getElementById('total').textContent = formatCurrency(cart.total || 0);

          if (!cart.items || cart.items.length === 0) {
            document.getElementById('cartItems').innerHTML = '<div class="cart-item"><p>Your cart is empty.</p></div>';
            return;
          }

          document.getElementById('cartItems').innerHTML = cart.items.map((item) => `
            <div class="cart-item">
              <div class="cart-top">
                <div>
                  <h3>${item.name}</h3>
                  <p>${formatCurrency(item.price)} each × ${item.quantity}</p>
                </div>
                <strong>${formatCurrency(item.price * item.quantity)}</strong>
              </div>
            </div>
          `).join('');
        } catch (error) {
          document.getElementById('cartItems').innerHTML = '<div class="cart-item"><p>Unable to load cart right now.</p></div>';
        }
      }

      loadCart();
    </script>
  </body>
</html>

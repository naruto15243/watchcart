<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Compare</title>
    <style>
      :root { --bg: #07111f; --panel: rgba(13, 28, 49, 0.9); --border: rgba(255,255,255,0.08); --text:#edf4ff; --muted:#a9bdd8; --primary:#7c8cff; --primary-2:#48c2ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg, #07111f 0%, #0d1c31 48%, #0b1527 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:700; }
      .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; }
      .compare-controls { display:flex; align-items:end; gap:14px; flex-wrap:wrap; margin:22px 0; }
      .compare-controls label { display:grid; gap:8px; min-width:min(100%, 320px); color:var(--muted); }
      .compare-controls select { min-height:44px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#102337; color:var(--text); }
      .compare-controls button { min-height:44px; padding:0 18px; border:0; border-radius:8px; background:linear-gradient(135deg, var(--primary), var(--primary-2)); color:white; font-weight:700; cursor:pointer; }
      .summary { margin:18px 0; color:var(--muted); }
      .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--panel); }
      table { width:100%; border-collapse:collapse; min-width:640px; text-align:left; }
      th, td { padding:14px 16px; border-bottom:1px solid var(--border); }
      th { color:var(--muted); font-size:0.85rem; font-weight:600; }
      tbody tr:last-child td { border-bottom:0; }
      .best-price { color:#57dfaa; font-weight:700; }
      .deal-link { text-decoration:underline; text-underline-offset:3px; }
      .status { min-height:24px; color:var(--muted); }
      @media (max-width:768px){ .topbar{display:grid; grid-template-columns:1fr; gap:12px;} }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="compare.html" class="active">Compare</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
          <a href="search.html">Search</a>
          <a href="stores.html">Stores</a>
          <a href="offers.html">Offers</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="checkout.html">Checkout</a>
          <a href="login.html">Login</a>
          <a href="profile.html">Profile</a>
        </nav>
      </header>

      <main class="page">
        <h2>Compare products</h2>
        <div class="compare-controls">
          <label for="productSelect">Select a product to compare store prices</label>
          <select id="productSelect" aria-label="Product to compare"></select>
          <button id="compareButton" type="button">Compare prices</button>
        </div>
        <p class="status" id="compareStatus" role="status" aria-live="polite"></p>
        <p class="summary" id="compareSummary"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Store</th><th>Price</th><th>Delivery</th><th>Store rating</th><th>Availability</th><th>Deal</th></tr>
            </thead>
            <tbody id="comparisonRows"></tbody>
          </table>
        </div>
      </main>
    <script>
      const API_BASE = 'http://localhost:5000/api';
      const productSelect = document.getElementById('productSelect');
      const comparisonRows = document.getElementById('comparisonRows');
      const compareSummary = document.getElementById('compareSummary');
      const compareStatus = document.getElementById('compareStatus');
      const formatCurrency = (value) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value || 0);

      async function loadProducts() {
        compareStatus.textContent = 'Loading products...';
        try {
          const response = await fetch(`${API_BASE}/products`);
          const result = await response.json();
          if (!response.ok || !result.success || !result.data?.length) throw new Error('No products are available.');

          productSelect.replaceChildren(...result.data.map((product) => new Option(product.name, product._id)));
          const requestedProduct = new URLSearchParams(window.location.search).get('product');
          if (requestedProduct && result.data.some((product) => product._id === requestedProduct)) {
            productSelect.value = requestedProduct;
          }
          compareStatus.textContent = '';
          await compareSelectedProduct();
        } catch (error) {
          compareStatus.textContent = error.message || 'Unable to load products. Check that the backend is running.';
        }
      }

      async function compareSelectedProduct() {
        if (!productSelect.value) return;
        compareStatus.textContent = 'Loading store prices...';
        comparisonRows.replaceChildren();
        compareSummary.textContent = '';

        try {
          const response = await fetch(`${API_BASE}/compare/${encodeURIComponent(productSelect.value)}`);
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.message || 'No store prices are available for this product.');

          const comparison = result.data;
          const stores = [...comparison.stores].sort((left, right) => left.price - right.price);
          compareSummary.textContent = `${comparison.product.name}: lowest ${formatCurrency(comparison.lowestPrice)} · highest ${formatCurrency(comparison.highestPrice)} · save up to ${formatCurrency(comparison.priceDifference)} by choosing the lowest price.`;

          for (const [index, store] of stores.entries()) {
            const row = document.createElement('tr');
            const values = [
              store.store,
              formatCurrency(store.price),
              store.delivery,
              `${Number(store.rating || 0).toFixed(1)} / 5`,
              store.availability,
            ];
            for (const [columnIndex, value] of values.entries()) {
              const cell = document.createElement('td');
              cell.textContent = value;
              if (index === 0 && columnIndex === 1) cell.className = 'best-price';
              row.appendChild(cell);
            }

            const dealCell = document.createElement('td');
            if (store.dealUrl) {
              const link = document.createElement('a');
              link.href = store.dealUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.className = 'deal-link';
              link.textContent = 'Visit store';
              dealCell.appendChild(link);
            } else {
              dealCell.textContent = 'Not available';
            }
            row.appendChild(dealCell);
            comparisonRows.appendChild(row);
          }
          compareStatus.textContent = '';
        } catch (error) {
          compareStatus.textContent = error.message || 'Unable to compare store prices.';
        }
      }

      document.getElementById('compareButton').addEventListener('click', compareSelectedProduct);
      productSelect.addEventListener('change', compareSelectedProduct);
      loadProducts();
    </script>
    </div>
    <script src="auth-guard.js"></script>
  </body>
</html>

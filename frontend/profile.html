<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Profile</title>
    <style>
      :root {
        --bg: #081521;
        --bg-soft: #0f1f31;
        --panel: rgba(16, 35, 55, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #edf6ff;
        --muted: #afd0ee;
        --primary: #7c8cff;
        --primary-2: #49c6ff;
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, rgba(89, 113, 255, 0.18), transparent 25%), linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:800; }
      .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow:0 10px 30px rgba(72,198,255,0.35); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; display:grid; grid-template-columns: 0.8fr 1.2fr; gap:24px; }
      .panel { background: linear-gradient(180deg, rgba(16,35,55,0.9), rgba(14,28,45,0.85)); border:1px solid var(--border); border-radius:24px; padding:22px; box-shadow: 0 15px 35px rgba(0,0,0,0.18); }
      .avatar { width:100px; height:100px; border-radius:50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); display:grid; place-items:center; font-size:2rem; font-weight:700; margin-bottom:16px; }
      .info { display:grid; gap:12px; }
      .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
      input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text); }
      label { display:block; margin-bottom:16px; }
      label span { display:block; margin-bottom:8px; }
      .btn { border:none; border-radius:999px; padding:0.9rem 1.2rem; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; font-weight:700; }
      @media (max-width:768px){ .topbar { display:grid; grid-template-columns:1fr; gap:12px; } .page { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
          <a href="login.html">Login</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>
      </header>

      <main class="page">
        <section class="panel">
          <div class="avatar">A</div>
          <h2>Alex Morgan</h2>
          <div class="info">
            <div class="row"><span>Email</span><strong>alex@watchcart.com</strong></div>
            <div class="row"><span>Member</span><strong>Gold</strong></div>
            <div class="row"><span>Orders</span><strong>12</strong></div>
            <div class="row"><span>Wishlist</span><strong>4 items</strong></div>
          </div>
        </section>

        <section class="panel">
          <h2>Edit profile</h2>
          <form id="profileForm">
            <label><span>Name</span><input type="text" value="Alex Morgan" /></label>
            <label><span>Phone</span><input type="text" value="+91 98765 43210" /></label>
            <label><span>Address</span><input type="text" value="123 Main Street, Bengaluru" /></label>
            <button class="btn" type="submit">Save changes</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:5000/api';

      async function loadProfile() {
        const token = localStorage.getItem('watchcart_token');
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });

          const result = await response.json();
          if (!result.success) {
            alert(result.message || 'Unable to load profile');
            return;
          }

          const user = result.user || {};
          const nameInput = document.querySelector('#profileForm input[type="text"]');
          const phoneInput = document.querySelectorAll('#profileForm input[type="text"]')[1];
          const addressInput = document.querySelectorAll('#profileForm input[type="text"]')[2];

          document.querySelector('.panel h2').textContent = user.name || 'Alex Morgan';
          if (nameInput) nameInput.value = user.name || '';
          if (phoneInput) phoneInput.value = user.phone || '';
          if (addressInput) addressInput.value = user.address || '';
        } catch (error) {
          console.error(error);
        }
      }

      document.getElementById('profileForm').addEventListener('submit', function (event) {
        event.preventDefault();
        alert('Profile updated successfully.');
      });

      loadProfile();
    </script>
  </body>
</html>

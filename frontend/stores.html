<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Stores</title>
    <style>
      :root { --bg: #07111f; --panel: rgba(13, 28, 49, 0.9); --border: rgba(255,255,255,0.08); --text:#edf4ff; --muted:#a9bdd8; --primary:#7c8cff; --primary-2:#48c2ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg, #07111f 0%, #0d1c31 48%, #0b1527 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:700; }
      .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; }
      .list { display:grid; gap:18px; }
      .store { display:flex; justify-content:space-between; align-items:center; gap:18px; background: var(--panel); border:1px solid var(--border); border-radius:20px; padding:20px; }
      .store h3 { margin:0 0 6px; }
      .meta { color: var(--muted); }
      .badge { display:inline-block; background: rgba(72, 194, 255, 0.12); color: var(--primary-2); border-radius:999px; padding:6px 10px; font-size:0.72rem; }
      @media (max-width:768px){ .topbar{display:grid; grid-template-columns:1fr; gap:12px;} .store{flex-direction:column; align-items:flex-start;} }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="stores.html" class="active">Stores</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
        </nav>
      </header>

      <main class="page">
        <h2>Nearby stores</h2>
        <div class="list">
          <article class="store">
            <div>
              <h3>TechHub Market</h3>
              <div class="meta">2.4 km away • 24 min delivery</div>
            </div>
            <span class="badge">Open now</span>
          </article>

          <article class="store">
            <div>
              <h3>Urban Gadget Plaza</h3>
              <div class="meta">4.1 km away • 32 min delivery</div>
            </div>
            <span class="badge">Fast delivery</span>
          </article>

          <article class="store">
            <div>
              <h3>SmartLife Hub</h3>
              <div class="meta">5.6 km away • 41 min delivery</div>
            </div>
            <span class="badge">Popular</span>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Login</title>
    <style>
      :root {
        --bg: #081521;
        --bg-soft: #0f1f31;
        --panel: rgba(16, 35, 55, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #edf6ff;
        --muted: #afd0ee;
        --primary: #7c8cff;
        --primary-2: #49c6ff;
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: radial-gradient(circle at top, rgba(89, 113, 255, 0.18), transparent 25%), linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:800; }
      .brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow:0 10px 30px rgba(72,198,255,0.35); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { display:grid; place-items:center; min-height:70vh; }
      .panel { width: min(100%, 480px); background: linear-gradient(180deg, rgba(16,35,55,0.9), rgba(14,28,45,0.85)); border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow: 0 15px 35px rgba(0,0,0,0.18); }
      h1 { margin-top:0; margin-bottom:18px; }
      label { display:block; margin-bottom:16px; }
      label span { display:block; margin-bottom:8px; }
      input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text); }
      .btn { width:100%; margin-top:8px; border:none; border-radius:999px; padding:0.9rem 1.2rem; font-weight:700; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; }
      .helper { margin-top:16px; text-align:center; color: var(--muted); }
      #nameField[hidden] { display:none; }
      @media (max-width:768px){ .topbar { display:grid; grid-template-columns:1fr; gap:12px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
          <a href="payment.html">Payment</a>
          <a href="login.html" class="active">Login</a>
          <a href="profile.html">Profile</a>
          <a href="search.html">Search</a>
          <a href="compare.html">Compare</a>
          <a href="stores.html">Stores</a>
          <a href="offers.html">Offers</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="checkout.html">Checkout</a>
        </nav>
      </header>

      <main class="page">
        <section class="panel">
          <h1 id="formTitle">Welcome back</h1>
          <form id="loginForm">
            <label id="nameField" hidden>
              <span>Name</span>
              <input type="text" autocomplete="name" />
            </label>
            <label>
              <span>Email</span>
              <input type="email" autocomplete="email" required />
            </label>
            <label>
              <span>Password</span>
              <input type="password" autocomplete="current-password" required />
            </label>
            <button class="btn" id="submitButton" type="submit">Login</button>
          </form>
          <div class="helper"><span id="helperText">New here?</span> <a href="#" id="modeToggle">Create account</a></div>
        </section>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:5000/api';
      let isRegisterMode = false;

      const nameField = document.querySelector('#nameField');
      const nameInput = nameField.querySelector('input');
      const emailInput = document.querySelector('input[type="email"]');
      const passwordInput = document.querySelector('input[type="password"]');
      const formTitle = document.getElementById('formTitle');
      const submitButton = document.getElementById('submitButton');
      const helperText = document.getElementById('helperText');
      const modeToggle = document.getElementById('modeToggle');

      modeToggle.addEventListener('click', function (event) {
        event.preventDefault();
        isRegisterMode = !isRegisterMode;
        nameField.hidden = !isRegisterMode;
        nameInput.required = isRegisterMode;
        passwordInput.autocomplete = isRegisterMode ? 'new-password' : 'current-password';
        formTitle.textContent = isRegisterMode ? 'Create your account' : 'Welcome back';
        submitButton.textContent = isRegisterMode ? 'Create account' : 'Login';
        helperText.textContent = isRegisterMode ? 'Already have an account?' : 'New here?';
        modeToggle.textContent = isRegisterMode ? 'Login' : 'Create account';
      });

      document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = emailInput.value;
        const password = passwordInput.value;
        const endpoint = isRegisterMode ? 'register' : 'login';
        const payload = isRegisterMode
          ? { name: nameInput.value, email, password }
          : { email, password };

        try {
          const response = await fetch(`${API_BASE}/auth/${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!result.success) {
            alert(result.message || (isRegisterMode ? 'Account creation failed' : 'Login failed'));
            return;
          }

          localStorage.setItem('watchcart_token', result.token);
          alert(isRegisterMode ? 'Account created successfully.' : 'Login successful. Opening the product catalog.');
          sessionStorage.removeItem('watchcart_return_to');
          window.location.href = 'products.html';
        } catch (error) {
          alert('Unable to connect to the backend right now.');
        }
      });
    </script>
    <script src="auth-guard.js"></script>
  </body>
</html>

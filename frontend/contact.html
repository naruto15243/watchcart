<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchCart | Contact</title>
    <style>
      :root { --bg: #07111f; --panel: rgba(13, 28, 49, 0.9); --border: rgba(255,255,255,0.08); --text:#edf4ff; --muted:#a9bdd8; --primary:#7c8cff; --primary-2:#48c2ff; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(135deg, #07111f 0%, #0d1c31 48%, #0b1527 100%); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; }
      .brand { display:flex; align-items:center; gap:12px; font-weight:700; }
      .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(135deg, var(--primary), var(--primary-2)); }
      .nav { display:flex; gap:18px; flex-wrap:wrap; color: var(--muted); }
      .nav a.active { color: var(--text); }
      .page { padding-top:28px; display:grid; grid-template-columns: 1fr 1fr; gap:24px; }
      .card { background: var(--panel); border:1px solid var(--border); border-radius:22px; padding:22px; box-shadow: 0 18px 40px rgba(3,8,17,0.25); }
      label { display:block; margin-bottom:16px; }
      label span { display:block; margin-bottom:8px; }
      input, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--text); }
      .btn { width:100%; border:none; border-radius:999px; padding:0.9rem 1.2rem; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; font-weight:700; }
      .info { color: var(--muted); line-height: 1.8; }
      @media (max-width:768px){ .topbar { display:grid; grid-template-columns:1fr; gap:12px; } .page { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">W</div><span>WatchCart</span></div>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="cart.html">Cart</a>
          <a href="orders.html">Orders</a>
        </nav>
      </header>

      <main class="page">
        <section class="card">
          <h2>Contact us</h2>
          <form id="contactForm">
            <label><span>Name</span><input type="text" value="Alex Morgan" /></label>
            <label><span>Email</span><input type="email" value="alex@watchcart.com" /></label>
            <label><span>Message</span><textarea rows="5">I need help with my order.</textarea></label>
            <button class="btn" type="submit">Send message</button>
          </form>
        </section>

        <aside class="card info">
          <h2>Support</h2>
          <div>Email: support@watchcart.com</div>
          <div>Phone: +91 98765 43210</div>
          <div>Location: Bengaluru, India</div>
          <div>Hours: Monday to Saturday, 9am - 8pm</div>
        </aside>
      </main>
    </div>

    <script>
      document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault();
        alert('Your message has been sent successfully.');
      });
    </script>
  </body>
</html>
